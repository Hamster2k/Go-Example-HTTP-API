services:
  api:
    image: ghcr.io/Hamster2k/Go-Example-HTTP-API/:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - api-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # Maintained fork; the original containrrr image fails against recent Docker versions
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"

volumes:
  api-data:
