services:
  api:
    image: ghcr.io/hamster2k/go-example-http-api:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - api-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Public domain pointing at this server, set in .env; defaults to a local self-signed cert
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  watchtower:
    # Maintained fork; the original containrrr image fails against recent Docker versions
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"

volumes:
  api-data:
  caddy-data:
  caddy-config:
